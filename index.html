<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💵 Advanced Withdraw Earnings</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8; --text-color: #f8fafc; --text-muted: #94a3b8; --input-bg: #0f172a; --border-color: #334155; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 20px; color: var(--accent-color); }
        .uid { font-size: 12px; color: var(--text-muted); background: var(--input-bg); padding: 4px 8px; border-radius: 6px; }
        .balance-card { background: linear-gradient(135deg, #0284c7, #0369a1); border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .balance-card span { font-size: 14px; color: #e0f2fe; display: block; margin-bottom: 5px; }
        .balance-card h1 { margin: 0; font-size: 32px; font-weight: 700; }
        label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; margin-top: 15px; }
        select, input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 15px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 25px; }
        .history-item { background: var(--input-bg); border: 1px solid var(--border-color); border-left: 4px solid #f59e0b; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .history-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .history-details .method { font-weight: 600; font-size: 15px; }
        .history-details .time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .history-amount { text-align: right; }
        .history-amount .amount { font-weight: 700; font-size: 16px; }
        .status { font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 600; display: inline-block; margin-top: 4px; }
        .status.pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status.paid { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status.rejected { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .history-user-inputs { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.03); padding: 6px; border-radius: 4px; margin-top: 8px; }
        .reject-reason { color: #f87171; font-size: 12px; background: rgba(239, 68, 68, 0.1); padding: 6px; border-radius: 4px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Withdraw</h2>
            <div class="uid" id="user-uid">UID: Fetching...</div>
        </div>
        <div class="balance-card">
            <span>Your Available Balance</span>
            <h1 id="user-balance">$0.00</h1>
        </div>
        <form id="withdrawForm">
            <label for="method">Select Payout Gateway</label>
            <select id="method" required>
                <option value="" disabled selected>Loading active methods...</option>
            </select>
            <div id="dynamic-fields"></div>
            <label for="amount">Withdrawal Amount ($)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
            <button type="submit" class="btn-submit">Submit Request</button>
        </form>
    </div>

    <div class="container">
        <div class="header" style="border: none; margin-bottom: 10px;">
            <h2 style="font-size: 18px; color: var(--text-color);">History</h2>
        </div>
        <div id="history-container">
            <p id="no-history" style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px;">Loading history...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://ranger-shop-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const telegramId = urlParams.get('id');
        let currentBalance = 0.00;
        let methodConfigs = {}; 

        // 🤖 TELEGRAM BOT NOTIFICATION CONFIG
        const BOT_TOKEN = ":8968747488:AAFo57k9oohFGLWlqy0NhQmHS5EoSZEtK48"; 
        let adminChatId = "7955518877";

        function sendTelegramTelegramMsg(chatId, textMessage) {
            if(!BOT_TOKEN || !chatId) return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: textMessage, parse_mode: "HTML" })
            }).catch(e => console.log(e));
        }

        database.ref('admin_settings/withdraw_methods').on('value', (snapshot) => {
            const methods = snapshot.val();
            const selectElement = document.getElementById('method');
            selectElement.innerHTML = '<option value="" disabled selected>Choose Method...</option>';
            if (methods) {
                methodConfigs = methods;
                Object.keys(methods).forEach(key => {
                    const m = methods[key];
                    if (m.status === true || m.status === "Active") {
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.innerText = (m.name || key) + (m.min_withdraw ? ` (Min: $${parseFloat(m.min_withdraw).toFixed(2)})` : " (No Min)");
                        selectElement.appendChild(opt);
                    }
                });
            }
        });

        // অ্যাডমিন আইডি লোড
        database.ref('admin_settings/admin_chat_id').on('value', (snap) => { if(snap.val()) adminChatId = snap.val(); });

        document.getElementById('method').addEventListener('change', function() {
            const fieldsContainer = document.getElementById('dynamic-fields');
            fieldsContainer.innerHTML = ''; 
            const config = methodConfigs[this.value];
            if (config && config.fields && Array.isArray(config.fields)) {
                config.fields.forEach((field) => {
                    const label = document.createElement('label'); label.innerText = field.label;
                    const input = document.createElement('input'); input.type = "text"; input.className = "custom-user-payout-input"; input.dataset.label = field.label; input.placeholder = `Enter ${field.label}...`; input.required = true;
                    fieldsContainer.appendChild(label); fieldsContainer.appendChild(input);
                });
            }
        });

        if (telegramId) {
            document.getElementById('user-uid').innerText = "UID: " + telegramId;
            database.ref('users/' + telegramId + '/balance').on('value', (snapshot) => {
                currentBalance = snapshot.val() ? parseFloat(snapshot.val()) : 0.00;
                document.getElementById('user-balance').innerText = "$" + currentBalance.toFixed(2);
            });

            database.ref('users/' + telegramId + '/withdraw_history').on('value', (snapshot) => {
                const historyContainer = document.getElementById('history-container');
                historyContainer.innerHTML = ''; const data = snapshot.val();
                if (data) {
                    Object.keys(data).reverse().forEach(key => {
                        const item = data[key];
                        let inputsHtml = '<div class="history-user-inputs">';
                        if(item.account_details) { Object.keys(item.account_details).forEach(l => { inputsHtml += `<div><strong>${l}:</strong> ${item.account_details[l]}</div>`; }); }
                        inputsHtml += '</div>';
                        let reasonHtml = (item.status === 'Rejected' && item.reject_reason) ? `<div class="reject-reason"><i class="fa-solid fa-circle-exclamation"></i><span>Reason: ${item.reject_reason}</span></div>` : '';
                        historyContainer.innerHTML += `<div class="history-item" style="border-left-color: ${item.status === 'Paid' ? '#10b981' : item.status === 'Rejected' ? '#ef4444' : '#f59e0b'}"><div class="history-top"><div class="history-details"><div class="method">${item.method_name}</div><div class="time">${item.time}</div></div><div class="history-amount"><div class="amount">$${parseFloat(item.amount).toFixed(2)}</div><span class="status ${item.status.toLowerCase()}">${item.status}</span></div></div>${inputsHtml}${reasonHtml}</div>`;
                    });
                } else { historyContainer.innerHTML = '<p style="color: #64748b; font-size: 13px; text-align: center; padding: 10px;">No history records.</p>'; }
            });
        }

        document.getElementById('withdrawForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!telegramId) { Swal.fire({ icon: 'error', title: 'Error', text: 'টেলিগ্রাম আইডি প্রয়োজন।' }); return; }

            const methodKey = document.getElementById('method').value;
            const targetMethodConfig = methodConfigs[methodKey];
            const methodName = targetMethodConfig.name || methodKey;
            const minWithdrawLimit = targetMethodConfig.min_withdraw ? parseFloat(targetMethodConfig.min_withdraw) : 0.00;
            const amount = parseFloat(document.getElementById('amount').value);
            const timestamp = new Date().toLocaleString();

            if (amount < minWithdrawLimit || amount > currentBalance) { Swal.fire({ icon: 'error', title: 'Error', text: 'লিমিট বা ব্যালেন্স সমস্যা!' }); return; }

            const accountDetails = {};
            const customInputs = document.querySelectorAll('.custom-user-payout-input');
            let primaryWalletNum = "";
            customInputs.forEach((input, i) => {
                accountDetails[input.dataset.label] = input.value.trim();
                if(i === 0) primaryWalletNum = input.value.trim();
            });

            const withdrawId = 'WID' + Math.floor(100000 + Math.random() * 900000);
            const payload = { id: withdrawId, user_id: telegramId, method_key: methodKey, method_name: methodName, account_details: accountDetails, amount: amount, status: "Pending", reject_reason: "", time: timestamp };

            database.ref('users/' + telegramId + '/balance').set(currentBalance - amount).then(() => {
                database.ref('users/' + telegramId + '/withdraw_history/' + withdrawId).set(payload);
                database.ref('admin_withdraw_requests/' + withdrawId).set(payload);

                // 🔔 ১. ইউজারকে উইথড্র পেন্ডিং মেসেজ
                const userMsg = `⏳ <b>Withdrawal Request Received!</b>\n\n<b>Withdraw ID:</b> ${withdrawId}\n<b>Method:</b> ${methodName}\n<b>Amount:</b> $${amount.toFixed(2)}\n<b>Status:</b> Pending 🟡\n\nঅ্যাডমিন রিভিউ করে পেমেন্ট পাঠিয়ে দিলে আপনাকে নোটিফিকেশন দেওয়া হবে।`;
                sendTelegramTelegramMsg(telegramId, userMsg);

                // 🔔 ২. অ্যাডমিনকে উইথড্র অ্যালার্ট মেসেজ
                const adminMsg = `💵 <b>New Withdrawal Request!</b>\n\n<b>Withdraw ID:</b> ${withdrawId}\n<b>Method:</b> ${methodName}\n<b>Amount:</b> $${amount.toFixed(2)}\n<b>User UID:</b> ${telegramId}\n<b>Account:</b> ${primaryWalletNum}\n\nপেমেন্ট করতে অ্যাডমিন প্যানেল চেক করুন।`;
                sendTelegramTelegramMsg(adminChatId, adminMsg);

                Swal.fire({ icon: 'success', title: 'Submitted!', text: 'রিকোয়েস্ট পাঠানো হয়েছে।' });
                document.getElementById('withdrawForm').reset();
                document.getElementById('dynamic-fields').innerHTML = '';
            });
        });
    </script>
</body>
</html>
