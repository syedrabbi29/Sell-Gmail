<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-input: #0d0d14;
            
            --accent-primary: #6c5ce7;
            --accent-secondary: #a29bfe;
            --accent-gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            
            --success: #00d26a;
            --success-bg: rgba(0, 210, 106, 0.1);
            --warning: #ffc107;
            --warning-bg: rgba(255, 193, 7, 0.1);
            --error: #ff6b6b;
            --error-bg: rgba(255, 107, 107, 0.1);
            
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
            --text-tertiary: #5a5a6e;
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-active: rgba(108, 92, 231, 0.5);
            
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle background gradient */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(162, 155, 254, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            min-height: 100vh;
            padding: 0 0 100px;
        }

        /* ========== Header ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border: none;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
            background: var(--bg-secondary);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 12px 6px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        .user-id {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ========== Balance Card ========== */
        .balance-section {
            padding: 24px 20px;
        }

        .balance-card {
            background: var(--accent-gradient);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .balance-card::after {
            content: '';
            position: absolute;
            bottom: -60%;
            left: -20%;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .balance-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .balance-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .balance-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .balance-label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            color: white;
            position: relative;
            z-index: 1;
        }

        .balance-amount span {
            font-size: 24px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* ========== Form Section ========== */
        .form-section {
            padding: 0 20px;
        }

        .section-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .section-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-primary);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-select {
            appearance: none;
            cursor: pointer;
            padding-right: 44px;
        }

        .select-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .select-arrow svg {
            width: 18px;
            height: 18px;
            fill: var(--text-tertiary);
        }

        /* Input with icon */
        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .form-input {
            padding-left: 48px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--text-tertiary);
        }

        /* Inline Error */
        .input-error {
            border-color: var(--error) !important;
        }

        .error-message {
            display: none;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 10px 12px;
            background: var(--error-bg);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--error);
        }

        .error-message.show {
            display: flex;
        }

        .error-message svg {
            width: 16px;
            height: 16px;
            fill: var(--error);
            flex-shrink: 0;
        }

        /* Success Message */
        .success-message {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background: var(--success-bg);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            border: 1px solid rgba(0, 210, 106, 0.2);
        }

        .success-message.show {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message svg {
            width: 24px;
            height: 24px;
            fill: var(--success);
            flex-shrink: 0;
        }

        .success-content h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 2px;
        }

        .success-content p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Quick Amount Buttons */
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .quick-btn {
            padding: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-btn:active {
            transform: scale(0.96);
        }

        .quick-btn.active {
            background: rgba(108, 92, 231, 0.15);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Submit Button */
        .submit-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--accent-gradient);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .submit-btn .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== History Section ========== */
        .history-section {
            padding: 0 20px 20px;
        }

        .history-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .history-tab {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .history-tab.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }

        .history-tab svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            transition: all 0.2s ease;
        }

        .history-item:active {
            transform: scale(0.99);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .history-method {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .method-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .method-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-primary);
        }

        .method-info h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .method-info span {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .history-amount {
            text-align: right;
        }

        .history-amount h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .status-pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .status-paid {
            background: var(--success-bg);
            color: var(--success);
        }

        .status-rejected {
            background: var(--error-bg);
            color: var(--error);
        }

        .history-details {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .detail-row:not(:last-child) {
            border-bottom: 1px solid var(--border-color);
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .detail-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .reject-reason {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            padding: 12px;
            background: var(--error-bg);
            border-radius: var(--radius-sm);
        }

        .reject-reason svg {
            width: 16px;
            height: 16px;
            fill: var(--error);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .reject-reason p {
            font-size: 12px;
            color: var(--error);
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .empty-icon svg {
            width: 28px;
            height: 28px;
            fill: var(--text-tertiary);
        }

        .empty-state h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-text {
            height: 14px;
            margin-bottom: 8px;
        }

        .skeleton-text:last-child {
            width: 60%;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .balance-amount {
                font-size: 36px;
            }
            
            .quick-amounts {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <button class="back-btn" onclick="window.history.back()">
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </button>
                    <h1 class="header-title">Withdraw</h1>
                </div>
                <div class="user-chip">
                    <div class="user-avatar">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <span class="user-id" id="user-uid">Loading...</span>
                </div>
            </div>
        </header>

        <!-- Balance Section -->
        <section class="balance-section">
            <div class="balance-card">
                <div class="balance-header">
                    <div class="balance-icon">
                        <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    </div>
                    <span class="balance-label">Available Balance</span>
                </div>
                <div class="balance-amount"><span>$</span><span id="user-balance">0.00</span></div>
            </div>
        </section>

        <!-- Form Section -->
        <section class="form-section">
            <!-- Success Message -->
            <div class="success-message" id="success-message">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <div class="success-content">
                    <h4>Request Submitted!</h4>
                    <p id="success-text">Your withdrawal is being processed.</p>
                </div>
            </div>

            <form id="withdrawForm">
                <!-- Method Selection -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-icon">
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                        </div>
                        <h3 class="section-title">Payment Method</h3>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Select Method</label>
                        <div class="input-wrapper">
                            <select class="form-select" id="method" required>
                                <option value="" disabled selected>Choose payment method...</option>
                            </select>
                            <div class="select-arrow">
                                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                            </div>
                        </div>
                        <div class="error-message" id="method-error">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <span>Please select a payment method</span>
                        </div>
                    </div>

                    <div id="dynamic-fields"></div>
                </div>

                <!-- Amount Section -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-icon">
                            <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                        </div>
                        <h3 class="section-title">Withdrawal Amount</h3>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Enter Amount</label>
                        <div class="input-icon-wrapper">
                            <div class="input-icon">
                                <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                            </div>
                            <input type="number" class="form-input" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                        <div class="error-message" id="amount-error">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <span id="amount-error-text">Please enter a valid amount</span>
                        </div>

                        <div class="quick-amounts">
                            <button type="button" class="quick-btn" data-amount="5">$5</button>
                            <button type="button" class="quick-btn" data-amount="10">$10</button>
                            <button type="button" class="quick-btn" data-amount="25">$25</button>
                            <button type="button" class="quick-btn" data-amount="all">All</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <!-- History Section -->
        <section class="history-section">
            <div class="section-header" style="margin-bottom: 16px;">
                <div class="section-icon">
                    <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                </div>
                <h3 class="section-title">Recent Withdrawals</h3>
            </div>

            <div class="history-tabs">
                <button class="history-tab active" data-filter="all">
                    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                    All
                </button>
                <button class="history-tab" data-filter="pending">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    Pending
                </button>
                <button class="history-tab" data-filter="paid">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Paid
                </button>
            </div>

            <div class="history-list" id="history-container">
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </div>
                    <h4>No withdrawals yet</h4>
                    <p>Your withdrawal history will appear here</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Submit Button -->
    <div class="submit-section">
        <button type="submit" class="submit-btn" id="submit-btn" form="withdrawForm">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            <span>Submit Withdrawal</span>
        </button>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = { databaseURL: "https://ranger-shop-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Get Telegram ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const telegramId = urlParams.get('id');

        // State
        let currentBalance = 0.00;
        let methodConfigs = {};
        let withdrawHistory = [];
        let currentFilter = 'all';

        // Telegram Bot Config
        const BOT_TOKEN = "8968747488:AAFo57k9oohFGLWlqy0NhQmHS5EoSZEtK48";
        let adminChatId = "7955518877";

        // DOM Elements
        const userUidEl = document.getElementById('user-uid');
        const userBalanceEl = document.getElementById('user-balance');
        const methodSelect = document.getElementById('method');
        const dynamicFields = document.getElementById('dynamic-fields');
        const amountInput = document.getElementById('amount');
        const submitBtn = document.getElementById('submit-btn');
        const historyContainer = document.getElementById('history-container');
        const successMessage = document.getElementById('success-message');

        // Initialize
        if (telegramId) {
            userUidEl.textContent = telegramId;
            initializeApp();
        } else {
            userUidEl.textContent = 'Not Found';
            showError('amount', 'Telegram ID not found in URL');
        }

        function initializeApp() {
            // Load balance
            database.ref('users/' + telegramId + '/balance').on('value', (snapshot) => {
                currentBalance = snapshot.val() ? parseFloat(snapshot.val()) : 0.00;
                userBalanceEl.textContent = currentBalance.toFixed(2);
            });

            // Load withdrawal methods
            database.ref('admin_settings/withdraw_methods').on('value', (snapshot) => {
                const methods = snapshot.val();
                methodSelect.innerHTML = '<option value="" disabled selected>Choose payment method...</option>';
                
                if (methods) {
                    methodConfigs = methods;
                    Object.keys(methods).forEach(key => {
                        const m = methods[key];
                        if (m.status === true || m.status === "Active") {
                            const opt = document.createElement('option');
                            opt.value = key;
                            const minText = m.min_withdraw ? ` (Min: $${parseFloat(m.min_withdraw).toFixed(2)})` : '';
                            opt.textContent = (m.name || key) + minText;
                            methodSelect.appendChild(opt);
                        }
                    });
                }
            });

            // Load admin chat ID
            database.ref('admin_settings/admin_chat_id').on('value', (snap) => {
                if (snap.val()) adminChatId = snap.val();
            });

            // Load withdrawal history
            database.ref('users/' + telegramId + '/withdraw_history').on('value', (snapshot) => {
                const data = snapshot.val();
                withdrawHistory = data ? Object.entries(data).map(([key, val]) => ({ id: key, ...val })).reverse() : [];
                renderHistory();
            });
        }

        // Method change handler
        methodSelect.addEventListener('change', function() {
            hideError('method');
            dynamicFields.innerHTML = '';
            
            const config = methodConfigs[this.value];
            if (config && config.fields && Array.isArray(config.fields)) {
                config.fields.forEach((field) => {
                    const group = document.createElement('div');
                    group.className = 'form-group';
                    
                    const label = document.createElement('label');
                    label.className = 'form-label';
                    label.textContent = field.label;
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-input custom-field';
                    input.dataset.label = field.label;
                    input.placeholder = `Enter ${field.label}...`;
                    input.required = true;
                    
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-message';
                    errorDiv.id = `field-error-${field.label.replace(/\s+/g, '-').toLowerCase()}`;
                    errorDiv.innerHTML = `
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <span>Please enter ${field.label}</span>
                    `;
                    
                    group.appendChild(label);
                    group.appendChild(input);
                    group.appendChild(errorDiv);
                    dynamicFields.appendChild(group);

                    input.addEventListener('input', () => {
                        input.classList.remove('input-error');
                        errorDiv.classList.remove('show');
                    });
                });
            }
        });

        // Amount input handler
        amountInput.addEventListener('input', () => hideError('amount'));

        // Quick amount buttons
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const amount = this.dataset.amount;
                if (amount === 'all') {
                    amountInput.value = currentBalance.toFixed(2);
                } else {
                    amountInput.value = amount;
                }
                hideError('amount');
            });
        });

        // History filter tabs
        document.querySelectorAll('.history-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.history-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderHistory();
            });
        });

        // Form submission
        document.getElementById('withdrawForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!telegramId) {
                showError('amount', 'Telegram ID is required');
                return;
            }

            // Validate method
            const methodKey = methodSelect.value;
            if (!methodKey) {
                showError('method', 'Please select a payment method');
                return;
            }

            const targetMethodConfig = methodConfigs[methodKey];
            const methodName = targetMethodConfig.name || methodKey;
            const minWithdrawLimit = targetMethodConfig.min_withdraw ? parseFloat(targetMethodConfig.min_withdraw) : 0.00;

            // Validate custom fields
            const customInputs = document.querySelectorAll('.custom-field');
            let fieldsValid = true;
            const accountDetails = {};

            customInputs.forEach(input => {
                if (!input.value.trim()) {
                    fieldsValid = false;
                    input.classList.add('input-error');
                    const errorId = `field-error-${input.dataset.label.replace(/\s+/g, '-').toLowerCase()}`;
                    document.getElementById(errorId)?.classList.add('show');
                } else {
                    accountDetails[input.dataset.label] = input.value.trim();
                }
            });

            if (!fieldsValid) return;

            // Validate amount
            const amount = parseFloat(amountInput.value);
            
            if (isNaN(amount) || amount <= 0) {
                showError('amount', 'Please enter a valid amount');
                return;
            }

            if (amount < minWithdrawLimit) {
                showError('amount', `Minimum withdrawal is $${minWithdrawLimit.toFixed(2)}`);
                return;
            }

            if (amount > currentBalance) {
                showError('amount', 'Insufficient balance');
                return;
            }

            // Submit withdrawal
            submitWithdrawal(methodKey, methodName, accountDetails, amount);
        });

        async function submitWithdrawal(methodKey, methodName, accountDetails, amount) {
            const originalBtnContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div><span>Processing...</span>';

            const timestamp = new Date().toLocaleString();
            const withdrawId = 'WID' + Math.floor(100000 + Math.random() * 900000);
            
            const payload = {
                id: withdrawId,
                user_id: telegramId,
                method_key: methodKey,
                method_name: methodName,
                account_details: accountDetails,
                amount: amount,
                status: "Pending",
                reject_reason: "",
                time: timestamp
            };

            try {
                // Update balance
                await database.ref('users/' + telegramId + '/balance').set(currentBalance - amount);
                
                // Save withdrawal request
                await database.ref('users/' + telegramId + '/withdraw_history/' + withdrawId).set(payload);
                await database.ref('admin_withdraw_requests/' + withdrawId).set(payload);

                // Send Telegram notifications
                const primaryWallet = Object.values(accountDetails)[0] || '';
                
                const userMsg = `<b>Withdrawal Request Received</b>\n\nWithdraw ID: ${withdrawId}\nMethod: ${methodName}\nAmount: $${amount.toFixed(2)}\nStatus: Pending\n\nOur team will review and process your payment shortly.`;
                sendTelegramMsg(telegramId, userMsg);

                const adminMsg = `<b>New Withdrawal Request</b>\n\nWithdraw ID: ${withdrawId}\nMethod: ${methodName}\nAmount: $${amount.toFixed(2)}\nUser UID: ${telegramId}\nAccount: ${primaryWallet}`;
                sendTelegramMsg(adminChatId, adminMsg);

                // Show success
                document.getElementById('success-text').textContent = `Withdrawal ID: ${withdrawId}`;
                successMessage.classList.add('show');
                
                // Reset form
                document.getElementById('withdrawForm').reset();
                dynamicFields.innerHTML = '';
                document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));

                // Hide success after 5 seconds
                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 5000);

            } catch (error) {
                console.error(error);
                showError('amount', 'Failed to submit. Please try again.');
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnContent;
        }

        function sendTelegramMsg(chatId, text) {
            if (!BOT_TOKEN || !chatId) return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: "HTML" })
            }).catch(console.error);
        }

        function renderHistory() {
            const filtered = currentFilter === 'all' 
                ? withdrawHistory 
                : withdrawHistory.filter(item => item.status.toLowerCase() === currentFilter);

            if (filtered.length === 0) {
                historyContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        </div>
                        <h4>No ${currentFilter === 'all' ? '' : currentFilter} withdrawals</h4>
                        <p>Your withdrawal history will appear here</p>
                    </div>
                `;
                return;
            }

            historyContainer.innerHTML = filtered.map(item => {
                const statusClass = item.status.toLowerCase();
                const statusIcon = getStatusIcon(statusClass);
                
                let detailsHtml = '';
                if (item.account_details) {
                    detailsHtml = `
                        <div class="history-details">
                            ${Object.entries(item.account_details).map(([label, value]) => `
                                <div class="detail-row">
                                    <span class="detail-label">${label}</span>
                                    <span class="detail-value">${value}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                let rejectHtml = '';
                if (item.status === 'Rejected' && item.reject_reason) {
                    rejectHtml = `
                        <div class="reject-reason">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <p>${item.reject_reason}</p>
                        </div>
                    `;
                }

                return `
                    <div class="history-item">
                        <div class="history-top">
                            <div class="history-method">
                                <div class="method-icon">
                                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                                </div>
                                <div class="method-info">
                                    <h4>${item.method_name}</h4>
                                    <span>${item.time}</span>
                                </div>
                            </div>
                            <div class="history-amount">
                                <h4>$${parseFloat(item.amount).toFixed(2)}</h4>
                                <span class="status-badge status-${statusClass}">
                                    ${statusIcon}
                                    ${item.status}
                                </span>
                            </div>
                        </div>
                        ${detailsHtml}
                        ${rejectHtml}
                    </div>
                `;
            }).join('');
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'pending':
                    return '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>';
                case 'paid':
                    return '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
                case 'rejected':
                    return '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
                default:
                    return '';
            }
        }

        function showError(field, message) {
            const errorEl = document.getElementById(`${field}-error`);
            const inputEl = document.getElementById(field);
            
            if (field === 'amount') {
                document.getElementById('amount-error-text').textContent = message;
            }
            
            if (errorEl) {
                errorEl.classList.add('show');
            }
            if (inputEl) {
                inputEl.classList.add('input-error');
            }
        }

        function hideError(field) {
            const errorEl = document.getElementById(`${field}-error`);
            const inputEl = document.getElementById(field);
            
            if (errorEl) {
                errorEl.classList.remove('show');
            }
            if (inputEl) {
                inputEl.classList.remove('input-error');
            }
        }
    </script>
</body>
    </html>
